name: Publish pkgrank

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Verify the tagged commit is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Match the tag to the package version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "pkgrank") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected v$version for this commit, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: cargo test --locked --all-targets --all-features
      - run: cargo publish --locked --dry-run --registry crates-io

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency: publish-pkgrank
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
