name: Publish pkgrank

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Tag the tested version on main, publish the crate, and build installers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main for a manual release
        if: inputs.release
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Verify the tagged commit is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Read the package version and check a pushed tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "pkgrank") | .version')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected v$version for this commit, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: cargo test --locked --all-targets --all-features
      - run: cargo publish --locked --dry-run --registry crates-io

  tag:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag at the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"

  installers:
    needs: [verify, tag]
    # A tag created by GITHUB_TOKEN does not start a push workflow.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
    permissions:
      contents: write

  publish:
    needs: [verify, tag]
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (github.event_name == 'push' || needs.tag.result == 'success')
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency: publish-pkgrank
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
